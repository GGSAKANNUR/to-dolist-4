
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Timed Reminders</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 1. Dark Blue Background */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #0f172a; /* Dark Blue */
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            min-height: 100vh; 
            margin: 0; 
            color: #e2e8f0; /* Light text for page */
        }

        .container { 
            background: #ffffff; /* White container for contrast */
            padding: 2rem; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 450px; 
            display: flex; 
            flex-direction: column; 
        }

        h2 { text-align: center; color: #1e293b; margin-top: 0; } /* Dark text inside container */
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        
        input { padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; outline: none; transition: border-color 0.2s; background-color: #f8fafc; color: #333;}
        input:focus { border-color: #0f172a; }
        
        button { padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .primary-btn { background-color: #0f172a; color: white; } /* Dark Blue Button */
        .text-btn { background:none; color:#0f172a; text-decoration:underline; padding: 10px; font-size: 0.9em; }
        
        #app-section, #reg-form { display: none; }
        ul { list-style: none; padding: 0; margin-top: 20px; }
        
        li { 
            background: #f1f5f9; 
            border: 1px solid #cbd5e1; 
            padding: 15px; 
            margin-bottom: 10px; 
            border-left: 5px solid #0f172a; /* Dark Blue border */
            border-radius: 4px; 
            transition: all 0.3s ease; 
            color: #334155; /* Dark grey text for readability */
        }
        
        .item-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .controls { display: flex; gap: 8px; margin-top: 10px; }
        
        .done-btn { background-color: #10b981; color: white; flex: 1; }
        .delete-btn { background-color: #ef4444; color: white; flex: 1; }
        .cancel-btn { background-color: #64748b; color: white; flex: 1; display: none; }
        
        .locked { border-left-color: #64748b; background-color: #e2e8f0; color: #475569; }
        .countdown { font-size: 11px; color: #b91c1c; font-weight: bold; display: block; margin-top: 5px; }

        /* Toast Notification Styles - Updated for Light mode on Dark BG */
        #toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .toast { background-color: #ffffff; color: #0f172a; padding: 12px 24px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-size: 14px; font-weight: 600; opacity: 0; animation: fadeInOut 3s forwards; display: flex; align-items: center; gap: 8px; border: 1px solid #cbd5e1; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: translateY(20px); } 10% { opacity: 1; transform: translateY(0); } 90% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-20px); } }
    </style>
</head>
<body>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

<!-- AUTH SECTION -->
<div class="container" id="auth-section">
    <div id="login-form">
        <h2>🔐 Login</h2>
        <div class="input-group">
            <input type="text" id="loginUser" placeholder="Username" onkeydown="if(event.key === 'Enter') login()">
            <input type="password" id="loginPass" placeholder="Password" onkeydown="if(event.key === 'Enter') login()">
            <button class="primary-btn" onclick="login()">Sign In</button>
        </div>
        <button class="text-btn" onclick="toggleAuth(true)">Register</button>
    </div>
    <div id="reg-form">
        <h2>📝 Register</h2>
        <div class="input-group">
            <input type="text" id="regUser" placeholder="Username">
            <input type="password" id="regPass" placeholder="Password">
            <button class="primary-btn" onclick="register()">Create Account</button>
        </div>
        <button class="text-btn" onclick="toggleAuth(false)">Back to Login</button>
    </div>
</div>

<!-- APP SECTION -->
<div class="container" id="app-section">
    <h2 id="welcomeMsg">🔔 Reminders</h2>
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Task...">
        <input type="date" id="dateInput">
        <button class="primary-btn" onclick="addReminder()">Set Reminder</button>
    </div>
    <ul id="reminderList"></ul>
    <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="primary-btn" onclick="downloadBackup()" style="flex: 1;">Download Backup</button>
        <button class="primary-btn" onclick="triggerUpload()" style="flex: 1;">Upload Backup</button>
    </div>
    <input type="file" id="backupFileInput" style="display: none;" accept=".json" onchange="uploadBackup(event)">
    <button onclick="logout()" style="width:100%; margin-top:10px; background:#475569; color:white;">Logout</button>
</div>

<!-- EVENT SECTION -->
<div class="container" id="event-section" style="display: none; margin-left: 20px;">
    <h2>📅 Events</h2>
    <div class="input-group">
        <input type="text" id="eventInput" placeholder="Event...">
        <input type="date" id="eventDateInput">
        <button class="primary-btn" onclick="addEvent()">Record Event</button>
    </div>
    <ul id="eventList"></ul>

    <!-- SUPABASE SYNC SECTION -->
    <div style="margin-top: 25px; border-top: 1px solid #cbd5e1; padding-top: 20px; color: #1e293b;">
        <h3 style="margin-top: 0; margin-bottom: 12px; font-size: 1.1em; color: #1e293b;">⚡ Supabase Sync</h3>
        <div class="input-group">
            <input type="text" id="supabaseUrl" placeholder="Supabase Project URL" style="font-size: 14px; padding: 10px;">
            <input type="password" id="supabaseKey" placeholder="Anon API Key" style="font-size: 14px; padding: 10px;">
        </div>
        <div style="display: flex; gap: 8px; margin-top: 10px;">
            <button class="primary-btn" onclick="saveSupabaseSettings()" style="flex: 1.2; padding: 10px; font-size: 13px; background-color: #475569; border-radius: 6px;">Save Keys</button>
            <button class="primary-btn" onclick="uploadToSupabase()" style="flex: 1; padding: 10px; font-size: 13px; background-color: #10b981; border-radius: 6px;">Upload</button>
            <button class="primary-btn" onclick="downloadFromSupabase()" style="flex: 1; padding: 10px; font-size: 13px; background-color: #3b82f6; border-radius: 6px;">Download</button>
        </div>
    </div>
</div>

<script>
    let currentUser = null;

    // --- UTILITIES ---
    const showToast = (message, icon = 'ℹ️') => {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    };

    // Helper: Convert yyyy-mm-dd to dd-mm-yyyy
    function formatDate(dateStr) {
        if (!dateStr) return '';
        const parts = dateStr.split('-');
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
    }

    const toggleAuth = (isReg) => {
        document.getElementById('login-form').style.display = isReg ? 'none' : 'block';
        document.getElementById('reg-form').style.display = isReg ? 'block' : 'none';
    };

    function logout() {
        currentUser = null;
        location.reload();
    }

    // --- AUTH LOGIC ---
    function register() {
        const u = document.getElementById('regUser').value.trim();
        const p = document.getElementById('regPass').value.trim();
        if(u && p) { 
            if(localStorage.getItem(`u_${u}`)) {
                showToast("User already exists!", "⚠️");
            } else {
                localStorage.setItem(`u_${u}`, p); 
                showToast("Registration Complete!", "✅"); 
                toggleAuth(false); 
            }
        } else {
            showToast("Please fill in all fields", "⚠️");
        }
    }

    function login() {
        const u = document.getElementById('loginUser').value.trim();
        const p = document.getElementById('loginPass').value.trim();
        if(localStorage.getItem(`u_${u}`) === p) { 
            currentUser = u; 
            startApp(); 
            showToast(`Welcome back, ${u}!`, "👋"); 
        }
        else showToast("Invalid credentials", "🚫");
    }

    function startApp() {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('app-section').style.display = 'block';
        document.getElementById('welcomeMsg').innerText = `🔔 ${currentUser}'s List`;
        loadItems();
    }

    // --- CORE TASK LOGIC ---
    function addReminder() {
        const task = document.getElementById('taskInput').value.trim();
        const date = document.getElementById('dateInput').value;
        if(!task || !date) return showToast("Please enter a task and date", "⚠️");
        
        const data = JSON.parse(localStorage.getItem(`data_${currentUser}`) || "[]");
        data.push({ task, date, doneDate: null }); // Date stored as standard yyyy-mm-dd for sorting
        localStorage.setItem(`data_${currentUser}`, JSON.stringify(data));
        
        document.getElementById('taskInput').value = '';
        document.getElementById('dateInput').value = '';
        
        showToast("Reminder added!", "➕");
        loadItems();
    }

    function loadItems() {
        const list = document.getElementById('reminderList');
        list.innerHTML = '';
        let data = JSON.parse(localStorage.getItem(`data_${currentUser}`) || "[]");

        // --- SORTING LOGIC ---
        // Sort by the raw ISO date (yyyy-mm-dd) so 01-01-2024 comes before 02-01-2023
        data.sort((a, b) => new Date(a.date) - new Date(b.date));

        // --- FILTER AND AUTO-DELETE ---
        const today = new Date();
        const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());

        data = data.filter(item => {
            const parts = item.date.split('-');
            const targetMidnight = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
            const diffTime = targetMidnight.getTime() - todayMidnight.getTime();
            const diffDaysTarget = Math.round(diffTime / (1000 * 60 * 60 * 24));
            
            return diffDaysTarget >= -2; // Automatically deletes if diffDaysTarget < -2 (more than 2 days after target date)
        });

        localStorage.setItem(`data_${currentUser}`, JSON.stringify(data));

        const now = new Date().getTime();

        data.forEach((item, i) => {
            const parts = item.date.split('-');
            const targetMidnight = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
            const diffTime = targetMidnight.getTime() - todayMidnight.getTime();
            const diffDaysTarget = Math.round(diffTime / (1000 * 60 * 60 * 24));

            // Hide reminders that are more than 2 days in the future
            if (diffDaysTarget > 2) {
                return;
            }

            const li = document.createElement('li');
            let statusHtml = "";
            let buttonHtml = "";
            let diffDays = 0;

            if (item.doneDate) {
                li.className = 'locked';
                const waitPeriod = 1 * 24 * 60 * 60 * 1000; // 1 Day
                const timePassed = now - item.doneDate;
                const remainingMs = waitPeriod - timePassed;
                diffDays = Math.ceil(remainingMs / (1000 * 60 * 60 * 24)); 
                const remainingHours = Math.ceil(remainingMs / (1000 * 60 * 60));

                statusHtml = remainingMs > 0 
                    ? `<span class="countdown">🔒 Delete in ${remainingHours}h</span>` 
                    : `<span class="countdown" style="color:green">✅ Ready for deletion</span>`;
                
                const canDelete = remainingMs <= 0;
                buttonHtml = `<button class="delete-btn" 
                    onclick="deleteItem(${i})" 
                    ${canDelete ? '' : 'disabled'}>
                    ${canDelete ? 'Delete' : 'Locked'}
                </button>`;
            } else {
                const confirmId = `confirm-${i}`;
                const cancelId = `cancel-${i}`;
                
                buttonHtml = `
                    <button id="done-${i}" class="done-btn" onclick="initiateDone(${i})">Done</button>
                    <button id="${cancelId}" class="cancel-btn" onclick="resetButtons(${i})">Cancel</button>
                `;
            }

            li.innerHTML = `
                <div class="item-header">
                    <div><strong>${item.task}</strong><br><small>📅 Due: ${formatDate(item.date)}</small></div>
                    ${statusHtml}
                </div>
                <div class="controls">
                    ${buttonHtml}
                </div>
            `;
            list.appendChild(li);
        });
    }

    // --- INTERACTION LOGIC ---

    function initiateDone(i) {
        const doneBtn = document.getElementById(`done-${i}`);
        const cancelBtn = document.getElementById(`cancel-${i}`);

        doneBtn.innerText = "Lock & Delete in 24h?";
        doneBtn.style.backgroundColor = "#b91c1c"; 
        doneBtn.onclick = function() { markDone(i); };
        
        cancelBtn.style.display = "block";
    }

    function resetButtons(i) {
        loadItems();
    }

    function markDone(i) {
        const data = JSON.parse(localStorage.getItem(`data_${currentUser}`));
        data[i].doneDate = new Date().getTime();
        localStorage.setItem(`data_${currentUser}`, JSON.stringify(data));
        showToast("Task locked for 24 hours!", "🔒");
        loadItems();
    }

    function deleteItem(i) {
        const data = JSON.parse(localStorage.getItem(`data_${currentUser}`));
        const waitPeriod = 1 * 24 * 60 * 60 * 1000; // 1 Day
        const now = new Date().getTime();
        const timePassed = now - data[i].doneDate;
        
        if (timePassed < waitPeriod) {
            const remainingHours = Math.ceil((waitPeriod - timePassed) / (1000 * 60 * 60));
            showToast(`Wait ${remainingHours}h before deleting`, "⏳");
            loadItems(); 
        } else {
            data.splice(i, 1);
            localStorage.setItem(`data_${currentUser}`, JSON.stringify(data));
            showToast("Item deleted", "🗑️");
            loadItems();
        }
    }
</script>

<!-- NEW EVENT SCRIPT -->
<script>
    // --- EVENT LOGIC ---
    
    // Local helper to guarantee dd-mm-yyyy format specifically for the event side
    function formatEventDate(dateStr) {
        if (!dateStr) return '';
        const parts = dateStr.split('-'); // Input is yyyy-mm-dd
        return `${parts[2]}-${parts[1]}-${parts[0]}`; // Returns dd-mm-yyyy
    }

    function addEvent() {
        const event = document.getElementById('eventInput').value.trim();
        const date = document.getElementById('eventDateInput').value;
        if(!event || !date) return showToast("Please enter an event and date", "⚠️");
        
        const data = JSON.parse(localStorage.getItem(`events_${currentUser}`) || "[]");
        data.push({ event, date }); 
        localStorage.setItem(`events_${currentUser}`, JSON.stringify(data));
        
        document.getElementById('eventInput').value = '';
        document.getElementById('eventDateInput').value = '';
        
        showToast("Event recorded!", "📅");
        loadEvents();
    }

    function loadEvents() {
        const list = document.getElementById('eventList');
        list.innerHTML = '';
        let data = JSON.parse(localStorage.getItem(`events_${currentUser}`) || "[]");

        // Auto arrange date-wise (chronological order)
        data.sort((a, b) => new Date(a.date) - new Date(b.date));
        
        // Save the sorted array back to localStorage so it stays arranged
        localStorage.setItem(`events_${currentUser}`, JSON.stringify(data));

        data.forEach((item) => {
            const li = document.createElement('li');
            // No controls rendered to ensure it is not editable or deletable
            // Date formatted strictly to dd-mm-yyyy using the local helper
            li.innerHTML = `
                <div class="item-header">
                    <div><strong>${item.event}</strong><br><small>📅 Date: ${formatEventDate(item.date)}</small></div>
                </div>
            `;
            list.appendChild(li);
        });
    }

    // --- BACKUP LOGIC ---
    function downloadBackup() {
        if (!currentUser) return;
        const backupData = {
            reminders: JSON.parse(localStorage.getItem(`data_${currentUser}`) || "[]"),
            events: JSON.parse(localStorage.getItem(`events_${currentUser}`) || "[]")
        };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${currentUser}_reminder_backup.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast("Backup downloaded!", "📥");
    }

    function triggerUpload() {
        document.getElementById('backupFileInput').click();
    }

    function uploadBackup(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data && (Array.isArray(data.reminders) || Array.isArray(data.events))) {
                    if (data.reminders) {
                        localStorage.setItem(`data_${currentUser}`, JSON.stringify(data.reminders));
                    }
                    if (data.events) {
                        localStorage.setItem(`events_${currentUser}`, JSON.stringify(data.events));
                    }
                    showToast("Backup uploaded successfully!", "📤");
                    loadItems();
                    loadEvents();
                } else {
                    showToast("Invalid backup file format", "⚠️");
                }
            } catch (err) {
                showToast("Failed to read backup file", "⚠️");
            }
        };
        reader.readAsText(file);
    }

    // --- SUPABASE INTEGRATION LOGIC ---
    let supabase = null;

    function initSupabase() {
        const url = localStorage.getItem('https://ypmuqujlvywbajksxyce.supabase.co');
        const key = localStorage.getItem('eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwbXVxdWpsdnl3YmFqa3N4eWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxODcyNzgsImV4cCI6MjA5Nzc2MzI3OH0.39MPIZqQhOn2zcFNmfeD3OmMCj4bJSE4vT3XqPgmEeE');
        if (url && key) {
            try {
                supabase = window.supabase.createClient(url, key);
            } catch (e) {
                console.error("Failed to initialize Supabase client:", e);
                supabase = null;
            }
        }
    }

    function saveSupabaseSettings() {
        const url = document.getElementById('supabaseUrl').value.trim();
        const key = document.getElementById('supabaseKey').value.trim();
        localStorage.setItem('supabase_url', url);
        localStorage.setItem('supabase_key', key);
        initSupabase();
        showToast("Settings saved!", "✅");
    }

    function loadSupabaseSettings() {
        const url = localStorage.getItem('supabase_url') || '';
        const key = localStorage.getItem('supabase_key') || '';
        const urlInput = document.getElementById('supabaseUrl');
        const keyInput = document.getElementById('supabaseKey');
        if (urlInput) urlInput.value = url;
        if (keyInput) keyInput.value = key;
    }

    async function uploadToSupabase() {
        initSupabase();
        if (!supabase) {
            return showToast("Please save valid Supabase credentials first", "⚠️");
        }
        if (!currentUser) return;

        showToast("Uploading to Supabase...", "⏳");
        try {
            const reminders = JSON.parse(localStorage.getItem(`data_${currentUser}`) || "[]");
            const events = JSON.parse(localStorage.getItem(`events_${currentUser}`) || "[]");

            // 1. Upload Reminders - Delete existing for user first, then insert
            const { error: delRemindersError } = await supabase
                .from('reminders')
                .delete()
                .eq('username', currentUser);

            if (delRemindersError) throw delRemindersError;

            if (reminders.length > 0) {
                const rows = reminders.map(r => ({
                    username: currentUser,
                    task: r.task,
                    date: r.date,
                    done_date: r.doneDate
                }));
                const { error: insRemindersError } = await supabase
                    .from('reminders')
                    .insert(rows);
                if (insRemindersError) throw insRemindersError;
            }

            // 2. Upload Events - Delete existing for user first, then insert
            const { error: delEventsError } = await supabase
                .from('events')
                .delete()
                .eq('username', currentUser);

            if (delEventsError) throw delEventsError;

            if (events.length > 0) {
                const rows = events.map(e => ({
                    username: currentUser,
                    event: e.event,
                    date: e.date
                }));
                const { error: insEventsError } = await supabase
                    .from('events')
                    .insert(rows);
                if (insEventsError) throw insEventsError;
            }

            showToast("Uploaded successfully to Supabase!", "✅");
        } catch (err) {
            console.error(err);
            showToast(`Upload failed: ${err.message || err}`, "❌");
        }
    }

    async function downloadFromSupabase() {
        initSupabase();
        if (!supabase) {
            return showToast("Please save valid Supabase credentials first", "⚠️");
        }
        if (!currentUser) return;

        showToast("Downloading from Supabase...", "⏳");
        try {
            // 1. Fetch Reminders
            const { data: dbReminders, error: errReminders } = await supabase
                .from('reminders')
                .select('*')
                .eq('username', currentUser);

            if (errReminders) throw errReminders;

            // 2. Fetch Events
            const { data: dbEvents, error: errEvents } = await supabase
                .from('events')
                .select('*')
                .eq('username', currentUser);

            if (errEvents) throw errEvents;

            // Map data structure back to client
            const reminders = dbReminders.map(r => ({
                task: r.task,
                date: r.date,
                doneDate: r.done_date ? parseInt(r.done_date, 10) : null
            }));

            const events = dbEvents.map(e => ({
                event: e.event,
                date: e.date
            }));

            localStorage.setItem(`data_${currentUser}`, JSON.stringify(reminders));
            localStorage.setItem(`events_${currentUser}`, JSON.stringify(events));

            showToast("Downloaded successfully from Supabase!", "✅");
            loadItems();
            loadEvents();
        } catch (err) {
            console.error(err);
            showToast(`Download failed: ${err.message || err}`, "❌");
        }
    }

    // Hook into the existing startApp function to show the Event section and load events on login
    const originalStartApp = startApp;
    startApp = function() {
        originalStartApp();
        document.getElementById('event-section').style.display = 'block';
        loadEvents();
        loadSupabaseSettings();
        initSupabase();
    };
</script>
</body>
</html>
